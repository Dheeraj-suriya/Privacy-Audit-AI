version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/privacy_audit.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your .env file}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_ENABLED=true
      - CORS_ORIGINS=http://localhost:5173
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment to pull model on start:
    # entrypoint: ["sh", "-c", "ollama serve & sleep 5 && ollama pull llama3 && wait"]

volumes:
  ollama_data:
